# Determine whether this request reached us over HTTPS — either directly
# (rare, since TLS termination normally happens at a reverse proxy in front
# of this container) or via X-Forwarded-Proto set by that upstream proxy.
# HSTS is only ever added when this evaluates to "yes", so plain-HTTP
# deployments (e.g. local `docker compose up` on http://localhost:5173)
# never get an HSTS header telling browsers to force HTTPS.
map $http_x_forwarded_proto $patient360_is_https {
    default   "";
    "https"   "yes";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (this is what actually matters for the SPA's own
    # HTML document — the FastAPI backend only ever returns JSON, so this,
    # not the API, is where CSP/X-Frame-Options/etc. genuinely take effect
    # in the browser) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Policy derived from what this app actually loads (inspected, not
    # copy-pasted): same-origin script/API, Google Fonts for style+font
    # sources, 'unsafe-inline' on style-src because Plotly.js sets inline
    # styles on the SVG elements it renders. No unsafe-eval — none of the
    # chart types this app uses (bar/pie/scatter) require it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    if ($patient360_is_https = "yes") {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
